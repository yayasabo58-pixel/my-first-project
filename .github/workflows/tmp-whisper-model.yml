name: Temporary Whisper Model Export

on:
  pull_request:
    paths:
      - '.tmp-whisper-trigger'

permissions:
  contents: read

jobs:
  export-model:
    runs-on: ubuntu-latest
    steps:
      - name: Download multilingual Whisper model
        run: |
          curl -L --fail --retry 3 \
            "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny-q5_1.bin" \
            -o ggml-tiny-q5_1.bin
          sha256sum ggml-tiny-q5_1.bin
      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-tiny-q5_1-model
          path: ggml-tiny-q5_1.bin
          retention-days: 1
