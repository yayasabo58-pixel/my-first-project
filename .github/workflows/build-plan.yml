name: Build Strategy Plan

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'generate_plan.py'
      - '.github/workflows/build-plan.yml'
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build-plan-run
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install python-docx
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer poppler-utils fonts-noto-cjk
      - name: Patch font initialization
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('generate_plan.py')
          s=p.read_text(encoding='utf-8').replace('._element.rPr.rFonts.set(', '._element.get_or_add_rPr().get_or_add_rFonts().set(')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Generate document
        run: python generate_plan.py
      - name: Render and inspect
        run: |
          mkdir -p rendered
          libreoffice --headless --convert-to pdf --outdir rendered output/*.docx
          pdfinfo rendered/*.pdf | tee rendered/page_count.txt
          PAGES=$(pdfinfo rendered/*.pdf | awk '/^Pages:/ {print $2}')
          echo "Rendered pages: $PAGES"
          if [ "$PAGES" -lt 120 ]; then
            echo "Page count below 120" >&2
            exit 1
          fi
      - name: Commit generated files to branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add output rendered
          git commit -m 'Build 120+ page strategy plan [skip ci]' || true
          git push origin HEAD:build-plan-run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: double-happiness-strategy-plan
          path: |
            output/*.docx
            rendered/*.pdf
            rendered/page_count.txt
