name: Build Strategy Plan

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'generate_plan.py'
      - 'augment_plan.py'
      - '.github/workflows/build-plan.yml'
  push:
    branches: [ main ]
    paths:
      - 'generate_plan.py'
      - 'augment_plan.py'
      - '.github/workflows/build-plan.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install python-docx
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer poppler-utils fonts-noto-cjk
      - name: Generate base document
        id: generate
        shell: bash
        run: |
          set +e
          python generate_plan.py > generate.log 2>&1
          CODE=$?
          cat generate.log
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Save diagnostics to branch
        if: steps.generate.outputs.exit_code != '0'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin build-plan-run
          git checkout build-plan-run
          cp "$GITHUB_WORKSPACE/generate.log" ./generate-error.log
          git add generate-error.log
          git commit -m 'Save generator error log [skip ci]' || true
          git push origin build-plan-run
      - name: Fail when generation failed
        if: steps.generate.outputs.exit_code != '0'
        run: exit 1
      - name: Augment document
        run: python augment_plan.py
      - name: Render and inspect
        run: |
          mkdir -p rendered
          libreoffice --headless --convert-to pdf --outdir rendered output/*.docx
          pdfinfo rendered/*.pdf | tee rendered/page_count.txt
          PAGES=$(pdfinfo rendered/*.pdf | awk '/^Pages:/ {print $2}')
          echo "Rendered pages: $PAGES"
          if [ "$PAGES" -lt 120 ]; then
            echo "Page count below 120" >&2
            exit 1
          fi
      - name: Commit generated files
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add output rendered
          git commit -m 'Build 120+ page strategy plan [skip ci]' || true
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: double-happiness-strategy-plan
          path: |
            output/*.docx
            rendered/*.pdf
            rendered/page_count.txt
            generate.log
